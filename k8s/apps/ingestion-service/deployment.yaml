apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: iot-sensor-platform
spec:
  # State lives in PostgreSQL, so pods are interchangeable. Flyway takes a PostgreSQL
  # advisory lock while migrating, so both pods can start at the same time safely.
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      serviceAccountName: ingestion-service-sa
      automountServiceAccountToken: false
      securityContext:
        # Matches the UID/GID created in ingestion-service/Dockerfile
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestion-service
          image: ingestion-service:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ingestion-service-config
          env:
            # TODO(hardening): the app connects as the postgres superuser. Create a dedicated
            # least-privilege role (separate migration vs. runtime users) in a later phase.
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # Memory request == limit: the JVM heap is sized from the limit (75%, see Dockerfile),
            # so the pod should be guaranteed that memory.
            #
            # GC: with these limits the JVM picks SerialGC, which is fine at this size. JDK 25 only
            # auto-selects G1 when the container has >= 2 CPUs AND ~1792Mi memory; raising the CPU
            # limit alone is not enough. For load testing, either raise both, or add -XX:+UseG1GC to
            # JAVA_TOOL_OPTIONS together with a CPU limit >= 2 (G1 is less efficient on a single core).
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
          # Gives the JVM up to 2 minutes to start before liveness/readiness kick in.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          # Failing -> container is restarted. Never depends on external systems.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Failing -> pod is removed from the Service endpoints, but not restarted.
          # Includes the DB check (see application.yaml), so a pod that cannot reach PostgreSQL stops receiving traffic.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            # Writable scratch space (Tomcat work dir, JVM temp files) on a read-only root filesystem
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
