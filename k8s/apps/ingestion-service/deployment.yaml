apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: iot-sensor-platform
spec:
  # Single replica while storage is in-memory H2: each pod would have its own data.
  # Scale out once PostgreSQL is wired in (Phase 2).
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      serviceAccountName: ingestion-service-sa
      automountServiceAccountToken: false
      securityContext:
        # Matches the UID/GID created in ingestion-service/Dockerfile
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestion-service
          image: ingestion-service:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # Memory request == limit: the JVM heap is sized from the limit (75%, see Dockerfile),
            # so the pod should be guaranteed that memory.
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
          # Gives the JVM up to 2 minutes to start before liveness/readiness kick in.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          # Failing -> container is restarted. Never depends on external systems.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Failing -> pod is removed from the Service endpoints, but not restarted.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            # Writable scratch space (Tomcat work dir, JVM temp files) on a read-only root filesystem
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
