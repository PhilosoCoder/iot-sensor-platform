spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:h2:mem:ingestion-service
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080
