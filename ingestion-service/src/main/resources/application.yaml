spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:h2:mem:ingestion-service
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        # Exposes /actuator/health/liveness and /actuator/health/readiness.
        # Auto-enabled on Kubernetes; set explicitly so they also work locally.
        # Keep external dependencies (DB, Kafka) out of liveness - otherwise an outage restarts every pod.
        enabled: true
