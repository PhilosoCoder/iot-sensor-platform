spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_sensor_platform
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        # Exposes /actuator/health/liveness and /actuator/health/readiness.
        # Auto-enabled on Kubernetes; set explicitly so they also work locally.
        # Keep external dependencies (DB, Kafka) out of liveness - otherwise an outage restarts every pod.
        enabled: true
      group:
        readiness:
          # A pod without a working DB connection is taken out of the Service, but not restarted:
          # liveness keeps its default (livenessState only).
          include: readinessState,db
