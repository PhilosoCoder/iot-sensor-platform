spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_sensor_platform
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      # Equivalent to @EnableSpringDataWebSupport(pageSerializationMode = VIA_DTO), but keeps Boot's
      # auto-configuration: declaring the annotation ourselves makes it back off and the page-size
      # settings below would be silently ignored.
      pageable:
        serialization-mode: via-dto
        default-page-size: 50
        max-page-size: 500
  mvc:
    problemdetails:
      enabled: true

ingestion:
  validation:
    # How far in the future measuredAt may be and still pass @PastOrPresent (device clock drift).
    clock-drift-tolerance: 5m

server:
  port: 8080

springdoc:
  # Both are springdoc's defaults; pinned so the URLs don't move with a library upgrade.
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        # Auto-enabled on Kubernetes; set explicitly so they also work locally.
        enabled: true
      group:
        readiness:
          # Keep external dependencies (DB, Kafka) out of liveness - otherwise an outage restarts every pod.
          include: readinessState,db
